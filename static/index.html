<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CRYTDL — YouTube Downloader</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23fafafa'/><path d='M11 10l10 6-10 6z' fill='%230a0a0a'/></svg>" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 7l9 5-9 5z" fill="currentColor"/></svg>
          </span>
          <span class="brand-name">CRYTDL</span>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
            <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <a class="icon-btn" href="https://github.com/newomp4/CRYTDL" target="_blank" rel="noopener" aria-label="Source on GitHub" title="Source">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.37-3.87-1.37-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.69 1.25 3.34.95.1-.74.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.18-1.49 3.14-1.18 3.14-1.18.63 1.59.23 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.43-2.69 5.4-5.25 5.69.41.36.78 1.06.78 2.13v3.16c0 .31.21.67.8.55A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
          </a>
        </div>
      </header>

      <section class="hero">
        <h1 class="hero-title">Download anything from YouTube.</h1>
        <p class="hero-sub">Paste a link. Pick a format. Get the file.</p>
      </section>

      <section class="card url-card">
        <div class="url-row">
          <span class="url-prefix" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.41 1.41"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.41-1.41"/></svg>
          </span>
          <input
            id="urlInput"
            type="url"
            placeholder="https://youtube.com/watch?v=..."
            autocomplete="off"
            spellcheck="false"
          />
          <button class="btn-ghost" id="pasteBtn" title="Paste from clipboard">Paste</button>
        </div>

        <div class="preview" id="preview" hidden>
          <img class="preview-thumb" id="previewThumb" alt="" />
          <div class="preview-meta">
            <div class="preview-title" id="previewTitle"></div>
            <div class="preview-sub" id="previewSub"></div>
          </div>
        </div>

        <div class="row">
          <div class="seg" role="tablist" aria-label="Format">
            <button class="seg-btn is-active" data-format="mp4" role="tab" aria-selected="true">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>
              <span>MP4 video</span>
            </button>
            <button class="seg-btn" data-format="mp3" role="tab" aria-selected="false">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
              <span>MP3 audio</span>
            </button>
          </div>

          <div class="select-wrap">
            <label class="label" for="qualitySelect">Quality</label>
            <select id="qualitySelect" class="select"></select>
          </div>
        </div>

        <details class="advanced">
          <summary>
            <span>Advanced</span>
            <svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </summary>
          <div class="advanced-grid">
            <label class="check">
              <input type="checkbox" id="optThumbnail" />
              <span class="check-box"></span>
              <span class="check-label">
                <span>Embed thumbnail</span>
                <span class="check-hint">Saves cover art into the file</span>
              </span>
            </label>
            <label class="check">
              <input type="checkbox" id="optMetadata" checked />
              <span class="check-box"></span>
              <span class="check-label">
                <span>Embed metadata</span>
                <span class="check-hint">Title, uploader, upload date, etc.</span>
              </span>
            </label>
            <label class="check" id="optSubsWrap">
              <input type="checkbox" id="optSubs" />
              <span class="check-box"></span>
              <span class="check-label">
                <span>Embed subtitles</span>
                <span class="check-hint">English subs (if available, MP4 only)</span>
              </span>
            </label>
          </div>
        </details>

        <button class="btn-primary" id="downloadBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
          <span>Download</span>
        </button>
      </section>

      <section class="card jobs-card" id="jobsCard" hidden>
        <div class="card-head">
          <h2>Active</h2>
        </div>
        <ul class="jobs" id="jobsList"></ul>
      </section>

      <section class="card history-card" id="historyCard" hidden>
        <div class="card-head">
          <h2>History</h2>
          <button class="btn-ghost" id="refreshHistory">Refresh</button>
        </div>
        <ul class="history" id="historyList"></ul>
      </section>

      <footer class="footer">
        <span id="footerStatus">checking…</span>
        <span class="dot">·</span>
        <span>files saved to <code>./downloads</code></span>
      </footer>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
